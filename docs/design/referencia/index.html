<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apólice · Conceito A — Institucional premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    corePlugins: { preflight: true },
    theme: {
      extend: {
        colors: {
          navy: { 950: '#071427', 900: '#0B1F3A', 850: '#102849', 800: '#16305A', 700: '#1D3B6B', 600: '#24508F' },
          gold: { 200: '#E6D3A8', 300: '#D9BF8C', 400: '#C9A86A', 500: '#B08D57', 700: '#7A5C2C' },
          ink: { DEFAULT: '#0E1A2C', 2: '#44526A', 3: '#5D697D' },
          canvas: '#F2F4F8', line: '#DFE4EC',
        },
        fontFamily: {
          serif: ['"Source Serif 4"', 'Georgia', 'serif'],
          sans: ['"Public Sans"', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  :root {
    --navy-950: #071427; --navy-900: #0B1F3A; --navy-850: #102849; --navy-800: #16305A; --navy-700: #1D3B6B; --navy-600: #24508F;
    --steel-400: #5E93CF; --brass-500: #B5862F;
    --gold-200: #E6D3A8; --gold-300: #D9BF8C; --gold-400: #C9A86A; --gold-500: #B08D57; --gold-700: #7A5C2C;
    --ink: #0E1A2C; --ink-2: #44526A; --ink-3: #5D697D;
    --on-navy: #F4F6FA; --on-navy-2: #B8C3D6; --on-navy-3: #8F9DB5;
    --canvas: #F2F4F8; --surface: #FFFFFF; --surface-2: #F7F8FB;
    --line: #DFE4EC; --line-soft: #ECEFF4; --control: #8A95A6;
    --ok: #1E6B47; --ok-bg: #E6F2EB; --warn: #8A5700; --warn-bg: #FBF0D9; --bad: #A3302A; --bad-bg: #FBE9E7;
    --r-card: 12px; --r-ctl: 8px;
    --shadow-overlay: 0 12px 28px -10px rgba(7, 20, 39, .28), 0 2px 6px rgba(7, 20, 39, .08);
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "Public Sans", system-ui, sans-serif;
  }

  /* ---------- Browser surfaces ---------- */
  ::selection { background: #E6D3A8; color: #0E1A2C; }
  html { caret-color: var(--navy-600); }
  body { font-family: var(--sans); color: var(--ink); background: #D9DEE6; -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.5; }
  :focus-visible { outline: 2px solid var(--navy-600); outline-offset: 2px; }
  .on-navy :focus-visible { outline-color: var(--gold-400); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #C3CBD7; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  a { color: inherit; text-decoration: none; }
  .tnum { font-variant-numeric: tabular-nums lining-nums; }

  /* ---------- Presentation deck (fora do produto) ---------- */
  .deck { padding: 48px 40px 96px; display: flex; flex-direction: column; align-items: center; gap: 56px; }
  .deck-head { width: 1440px; display: flex; justify-content: space-between; align-items: baseline; color: #2E3A4E; }
  .deck-head h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .deck-head p { font-size: 14px; color: #44526A; }
  .shot { display: flex; flex-direction: column; gap: 12px; }
  .shot > figcaption { font-size: 13px; font-weight: 600; color: #2E3A4E; }
  .screen { position: relative; overflow: hidden; background: var(--canvas); box-shadow: 0 30px 60px -30px rgba(7,20,39,.35); }
  .screen--desk { width: 1440px; }
  .screen--phone { width: 390px; border-radius: 0; }

  /* ---------- Serif numerals ---------- */
  .fig { font-family: var(--serif); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1; font-optical-sizing: auto; letter-spacing: -0.015em; }
  .fig .u { font-family: var(--sans); font-size: max(11px, .42em); font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-right: .28em; vertical-align: .55em; }
  .fig .u-after { font-family: var(--sans); font-size: max(11px, .42em); font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: .22em; }
  .fig .c { font-size: .6em; letter-spacing: 0; }
  .on-navy .fig .u, .on-navy .fig .u-after { color: var(--on-navy-2); }

  /* ---------- Icons ---------- */
  .ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic-sm { width: 15px; height: 15px; }
  .ic-xs { width: 13px; height: 13px; stroke-width: 2; }

  /* ---------- Brand ---------- */
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand__mark { width: 30px; height: 30px; flex: none; }
  .brand__word { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; line-height: 1; }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-ctl); font-size: 14px; font-weight: 600; white-space: nowrap; transition: background-color .18s cubic-bezier(.2,.8,.2,1), border-color .18s, color .18s; cursor: pointer; }
  .btn--primary { background: var(--navy-900); color: #fff; }
  .btn--primary:hover { background: var(--navy-800); }
  .btn--secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 1px 1px rgba(7,20,39,.04); }
  .btn--secondary:hover { border-color: #C5CDD9; background: var(--surface-2); }
  .btn--ghost { color: var(--ink-2); }
  .btn--ghost:hover { background: rgba(14,26,44,.05); color: var(--ink); }
  .btn--lg { height: 46px; font-size: 15px; padding: 0 20px; }
  .btn--danger-ghost { color: var(--bad); }

  /* ---------- Badges ---------- */
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge--ok { color: var(--ok); background: var(--ok-bg); }
  .badge--warn { color: var(--warn); background: var(--warn-bg); }
  .badge--bad { color: var(--bad); background: var(--bad-bg); }
  .badge--neutral { color: var(--ink-2); background: #EBEEF3; }
  .badge--plain::before { display: none; }

  /* ---------- Cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
  .card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0; }
  .card__title { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; color: var(--ink); }
  .card__sub { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
  .link { color: var(--navy-600); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; text-underline-offset: 3px; }
  .link:hover { text-decoration: underline; }
  .code { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .01em; }

  /* ---------- App shell ---------- */
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }
  .side { background: var(--navy-900); color: var(--on-navy-2); display: flex; flex-direction: column; padding: 22px 14px 16px; position: relative; overflow: hidden; }
  .side .brand { padding: 4px 10px 0; color: var(--on-navy); }
  .side__org { margin: 22px 6px 18px; padding: 12px 12px; border: 1px solid rgba(201,168,106,.28); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .side__org b { display: block; color: var(--on-navy); font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .side__org span { font-size: 12px; color: var(--on-navy-3); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav__item { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--on-navy-2); transition: background-color .18s, color .18s; }
  .nav__item:hover { background: rgba(255,255,255,.05); color: var(--on-navy); }
  .nav__item .ic { color: var(--on-navy-3); }
  .nav__item.is-active { background: var(--navy-800); color: #fff; font-weight: 600; }
  .nav__item.is-active .ic { color: var(--gold-400); }
  .nav__count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--on-navy-2); font-variant-numeric: tabular-nums; }
  .nav__item.is-locked { color: var(--on-navy-3); }
  .nav__item.is-locked .lock { margin-left: auto; width: 14px; height: 14px; }
  .nav__sep { height: 1px; background: rgba(255,255,255,.08); margin: 14px 10px; }
  .side__user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; border-top: 1px solid rgba(255,255,255,.08); }
  .side__user b { color: var(--on-navy); font-weight: 600; font-size: 13.5px; display: block; line-height: 1.3; }
  .side__user span { font-size: 12px; color: var(--on-navy-3); }
  .side__user .switch { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--on-navy-2); }
  .side__user .switch:hover { background: rgba(255,255,255,.06); }

  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-weight: 600; font-size: 14px; flex: none; letter-spacing: .01em; }
  .avatar--navy { background: #E3E9F3; color: var(--navy-700); }
  .avatar--steel { background: #E1ECF8; color: #1F4A85; }
  .avatar--gold { background: #F4ECDC; color: var(--gold-700); }
  .avatar--dark { background: var(--navy-900); color: var(--gold-300); box-shadow: inset 0 0 0 1px rgba(201,168,106,.45); }
  .avatar--ring { box-shadow: 0 0 0 1px rgba(201,168,106,.55); }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 40px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .search { display: flex; align-items: center; gap: 10px; width: 420px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2); color: var(--ink-3); font-size: 14px; }
  .search kbd { margin-left: auto; font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 1px 6px; }
  .topbar__right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .iconbtn { width: 40px; height: 40px; border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--ink-2); position: relative; }
  .iconbtn:hover { background: var(--surface-2); color: var(--ink); }
  .iconbtn .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px #fff; }
  .env { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--gold-700); background: #F6EFE1; border: 1px solid #E8D9B8; border-radius: 999px; height: 26px; padding: 0 10px; }

  .page { padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .page-title { font-family: var(--serif); font-weight: 600; font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; color: var(--ink); }
  .page-sub { font-size: 14px; color: var(--ink-3); margin-top: 6px; }
  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
  .crumbs a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .crumbs .ic { width: 13px; height: 13px; color: #9AA4B4; }
  .crumbs b { color: var(--ink-2); font-weight: 600; }

  /* ---------- KPI strip ---------- */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); }
  .kpi { padding: 20px 20px 20px 22px; position: relative; }
  .kpi + .kpi::before { content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 1px; background: var(--line-soft); }
  .kpi__label { font-size: 13px; font-weight: 500; color: var(--ink-2); line-height: 1.3; }
  .kpi__value { font-size: 36px; font-weight: 500; line-height: 1.1; color: var(--ink); margin-top: 10px; white-space: nowrap; }
  .kpi__meta { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; line-height: 1.35; white-space: nowrap; }
  .delta-up { color: var(--ok); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; vertical-align: -1px; margin-right: 2px; }
  .delta-warn { color: var(--warn); font-weight: 600; margin-right: 2px; }
  .meter { position: relative; height: 4px; border-radius: 4px; background: #E7EBF1; margin-top: 12px; }
  .meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--navy-600); }
  .meter > b { position: absolute; top: -4px; width: 2px; height: 12px; background: var(--gold-500); border-radius: 1px; }

  /* ---------- Dashboard grid ---------- */
  .grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
  .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; }

  .chart-total { text-align: right; }
  .chart-total .fig { font-size: 28px; font-weight: 500; line-height: 1.1; }
  .chart-total small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
  .chart-svg text { font-family: var(--sans); font-variant-numeric: tabular-nums; }

  .stack { display: flex; gap: 2px; height: 12px; margin: 22px 24px 4px; }
  .stack > i { display: block; height: 100%; }
  .stack > i:first-child { border-radius: 4px 0 0 4px; } .stack > i:last-child { border-radius: 0 4px 4px 0; }
  .prod-list { padding: 8px 24px 0; }
  .prod { display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .prod:last-child { border-bottom: 0; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .prod b { font-weight: 600; font-size: 14px; display: block; }
  .prod span { font-size: 12.5px; color: var(--ink-3); }
  .prod .val { text-align: right; }
  .prod .val .fig { font-size: 19px; font-weight: 500; display: block; line-height: 1.2; }
  .prod-foot { margin: 8px 24px 0; padding: 14px 0 20px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .prod-foot span { display: block; font-size: 12px; color: var(--ink-3); }
  .prod-foot b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .feed { padding: 10px 24px 8px; }
  .feed__row { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .feed__row:last-child { border-bottom: 0; }
  .chip { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
  .chip--navy { background: #E7ECF5; color: var(--navy-700); }
  .chip--steel { background: #E3EDF8; color: #1F4A85; }
  .chip--warn { background: var(--warn-bg); color: var(--warn); }
  .chip--gold { background: #F4ECDC; color: var(--gold-700); }
  .chip--bad { background: var(--bad-bg); color: var(--bad); }
  .feed__text { font-size: 14px; color: var(--ink); line-height: 1.45; }
  .feed__text a { font-weight: 600; color: var(--navy-600); font-variant-numeric: tabular-nums; }
  .feed__text a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .feed__meta { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .feed__time { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px; text-align: right; }
  .feed__time b { display: block; font-weight: 600; color: var(--ink); font-size: 13px; }

  .renew-sum { display: flex; align-items: baseline; gap: 10px; padding: 18px 24px 4px; }
  .renew-sum .fig { font-size: 34px; font-weight: 500; line-height: 1; }
  .renew-sum span { font-size: 13px; color: var(--ink-3); }
  .renew-list { padding: 6px 24px 0; }
  .renew { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .renew:last-child { border-bottom: 0; }
  .renew b { display: block; font-size: 13.5px; font-weight: 600; }
  .renew span { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .renew .r { text-align: right; }
  .renew .r b { font-variant-numeric: tabular-nums; }

  /* ---------- Login ---------- */
  .login { display: grid; grid-template-columns: 620px 1fr; height: 900px; }
  .login__brandside { background: var(--navy-950); color: var(--on-navy); position: relative; overflow: hidden; padding: 48px 56px; display: flex; flex-direction: column; }
  .login__brandside .brand__word { font-size: 26px; }
  .login__brandside .brand__mark { width: 36px; height: 36px; }
  .login__engrave { position: absolute; right: -250px; bottom: -250px; width: 760px; height: 760px; pointer-events: none; }
  .login__band { position: absolute; left: 0; right: 0; top: 118px; height: 40px; opacity: .9; pointer-events: none; }
  .login__headline { font-family: var(--serif); font-weight: 500; font-size: 46px; line-height: 1.1; letter-spacing: -0.022em; max-width: 480px; margin-top: 132px; text-wrap: balance; }
  .login__lede { font-size: 16px; line-height: 1.6; color: var(--on-navy-2); max-width: 450px; margin-top: 20px; }
  .specimen { margin-top: auto; position: relative; width: 420px; border: 1px solid rgba(201,168,106,.38); border-radius: 12px; padding: 20px 22px 18px; background: rgba(11,31,58,.82); }
  .specimen__row { display: flex; align-items: center; justify-content: space-between; }
  .specimen__prod { font-size: 12.5px; font-weight: 600; color: var(--gold-300); display: flex; align-items: center; gap: 6px; }
  .specimen__num { font-family: var(--serif); font-size: 24px; font-weight: 500; letter-spacing: -0.01em; margin-top: 8px; font-variant-numeric: lining-nums tabular-nums; }
  .specimen__who { font-size: 13px; color: var(--on-navy-2); margin-top: 2px; }
  .term { margin-top: 16px; }
  .term__bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); position: relative; }
  .term__bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--gold-400); }
  .term__labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--on-navy-3); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .specimen__foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
  .specimen__foot .lbl { font-size: 12px; color: var(--on-navy-3); display: block; margin-bottom: 2px; }
  .specimen__foot .val { color: var(--on-navy); font-size: 14px; font-weight: 600; display: block; font-variant-numeric: tabular-nums; }
  .specimen__foot .fig { font-size: 24px; font-weight: 500; color: #fff; }
  .badge--on-navy { color: #8FE0B5; background: rgba(46,160,105,.16); box-shadow: inset 0 0 0 1px rgba(143,224,181,.25); }
  .login__legal { margin-top: 28px; font-size: 12.5px; color: var(--on-navy-3); display: flex; gap: 16px; }

  .login__formside { background: var(--surface); display: flex; flex-direction: column; padding: 40px 56px; }
  .login__topnav { display: flex; justify-content: flex-end; gap: 20px; font-size: 13.5px; color: var(--ink-2); }
  .login__topnav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .login__col { width: 460px; margin: auto; padding-bottom: 24px; }
  .login__title { font-family: var(--serif); font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .login__intro { font-size: 15px; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
  .personas { margin-top: 28px; border: 0; }
  .personas legend { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 10px; display: flex; width: 100%; justify-content: space-between; }
  .personas legend span { font-weight: 500; color: var(--ink-3); font-size: 12.5px; }
  .persona-list { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
  .persona { display: grid; grid-template-columns: 40px 1fr 20px; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); transition: background-color .18s; cursor: pointer; }
  .persona:last-child { border-bottom: 0; }
  .persona .avatar { width: 40px; height: 40px; font-size: 15px; }
  .persona b { font-weight: 600; font-size: 15px; color: var(--ink); }
  .persona .role { font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .persona .scope { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
  .persona .go { color: #9AA4B4; transition: transform .2s cubic-bezier(.2,.8,.2,1), color .2s; }
  .persona:hover, .persona.is-hover { background: #F5F7FB; }
  .persona:hover .go, .persona.is-hover .go { color: var(--navy-900); transform: translateX(2px); }
  .divider { display: flex; align-items: center; gap: 14px; margin: 26px 0 20px; font-size: 12.5px; color: var(--ink-3); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field + .field { margin-top: 14px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .input { height: 44px; border: 1px solid var(--control); border-radius: var(--r-ctl); padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); background: #fff; }
  .input .ph { color: var(--ink-3); }
  .input .ic { color: var(--ink-3); }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
  .check i { width: 16px; height: 16px; border: 1px solid var(--control); border-radius: 4px; background: #fff; }
  .login__note { margin-top: 18px; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }

  /* ---------- Policy detail ---------- */
  .policy-face { background: var(--navy-900); color: var(--on-navy); border-radius: 14px; position: relative; overflow: hidden; }
  .policy-face__engrave { position: absolute; right: -150px; top: -250px; width: 520px; height: 520px; pointer-events: none; }
  .policy-face__band { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, #8E6E3C, #D9BF8C 35%, #A9884F 65%, #D2B47C); opacity: .85; }
  .policy-face__top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding: 30px 32px 26px; }
  .policy-face__kind { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--gold-300); }
  .policy-face__kind span { color: var(--on-navy-3); font-weight: 500; }
  .policy-face__num { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
  .policy-face__num h2 { font-family: var(--serif); font-size: 40px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: lining-nums tabular-nums; }
  .policy-face__who { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--on-navy-2); }
  .policy-face__who b { color: var(--on-navy); font-weight: 600; }
  .policy-actions { display: flex; gap: 8px; }
  .btn--on-navy { color: var(--on-navy); border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.02); }
  .btn--on-navy:hover { background: rgba(255,255,255,.08); }
  .btn--light { background: #fff; color: var(--navy-900); }
  .btn--light:hover { background: #EEF1F6; }
  .btn--cancel { color: #F2A69E; }
  .btn--cancel:hover { background: rgba(242,166,158,.1); }
  .policy-facts { position: relative; display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; border-top: 1px solid rgba(201,168,106,.3); background: #091A31; }
  .pfact { padding: 20px 28px 24px 32px; }
  .pfact + .pfact { border-left: 1px solid rgba(255,255,255,.08); }
  .pfact__label { font-size: 12.5px; font-weight: 500; color: var(--on-navy-3); }
  .pfact__value { font-size: 15px; font-weight: 600; color: var(--on-navy); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .pfact__value.fig { font-size: 30px; font-weight: 500; line-height: 1.05; margin-top: 4px; }
  .pfact__note { font-size: 12.5px; color: var(--on-navy-3); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .detail-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: start; }
  .tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .tbl th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-align: left; padding: 10px 16px; background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tbl th:first-child, .tbl td:first-child { padding-left: 24px; }
  .tbl th:last-child, .tbl td:last-child { padding-right: 24px; }
  .tbl td { padding: 13px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: top; font-size: 14px; }
  .tbl .num { text-align: right; white-space: nowrap; }
  .tbl td .sub { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
  .tbl td.codecell { color: var(--ink-2); font-weight: 600; font-size: 13px; padding-top: 15px; }
  .tbl tbody tr:hover td { background: #FAFBFD; }
  .tbl tfoot td { border-bottom: 0; padding-top: 8px; padding-bottom: 8px; color: var(--ink-2); }
  .tbl tfoot tr:first-child td { padding-top: 16px; }
  .tbl tfoot tr.total td { padding-top: 14px; padding-bottom: 20px; color: var(--ink); }
  .tbl tfoot tr.total td.num .fig { font-size: 24px; font-weight: 500; }

  .sched { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 18px 24px 24px; }
  .inst { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-variant-numeric: tabular-nums; }
  .inst__n { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .inst__n .ic { color: var(--ok); }
  .inst__d { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
  .inst__v { font-size: 15px; font-weight: 600; color: var(--ink); margin-top: 2px; }
  .inst__s { font-size: 12px; color: var(--ok); margin-top: 6px; font-weight: 500; }
  .inst.is-paid { background: #FBFCFD; }
  .inst.is-next { border-color: var(--navy-700); box-shadow: inset 0 0 0 1px var(--navy-700); }
  .inst.is-next .inst__s { color: var(--navy-700); font-weight: 600; }
  .inst.is-open .inst__s { color: var(--ink-3); }

  .tl { padding: 18px 24px 22px; }
  .tl__item { display: grid; grid-template-columns: 20px 1fr; gap: 12px; position: relative; padding-bottom: 20px; }
  .tl__item:last-child { padding-bottom: 0; }
  .tl__item::before { content: ""; position: absolute; left: 9.5px; top: 18px; bottom: -2px; width: 1px; background: var(--line); }
  .tl__item:last-child::before { display: none; }
  .tl__node { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
  .tl__node i { width: 8px; height: 8px; border-radius: 50%; }
  .tl__node--warn { background: var(--warn-bg); } .tl__node--warn i { background: var(--warn); }
  .tl__node--gold { background: #F4ECDC; } .tl__node--gold i { background: var(--gold-500); }
  .tl__node--steel { background: #E3EDF8; } .tl__node--steel i { background: var(--steel-400); }
  .tl__node--navy { background: #E3E9F3; } .tl__node--navy i { background: var(--navy-700); }
  .tl__when { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tl__what { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 2px; }
  .tl__what a { color: var(--navy-600); }
  .tl__desc { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.5; }
  .tl__desc .badge { margin-top: 8px; }

  .docs { padding: 10px 24px 14px; }
  .doc { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .doc:last-child { border-bottom: 0; }
  .doc__ic { width: 34px; height: 40px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: var(--bad); letter-spacing: .04em; background: #fff; flex: none; }
  .doc b { display: block; font-size: 13.5px; font-weight: 600; }
  .doc span { font-size: 12.5px; color: var(--ink-3); }
  .doc .iconbtn { margin-left: auto; width: 34px; height: 34px; }

  /* ---------- Quote wizard ---------- */
  .stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 0 24px 18px; }
  .step { display: flex; align-items: flex-start; gap: 12px; position: relative; padding-top: 18px; border-top: 3px solid var(--line); }
  .step.is-done { border-top-color: var(--navy-700); }
  .step.is-current { border-top-color: var(--gold-500); }
  .step__dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
  .step.is-done .step__dot { background: var(--navy-900); color: #fff; }
  .step.is-current .step__dot { background: #fff; color: var(--navy-900); box-shadow: inset 0 0 0 2px var(--navy-900); }
  .step.is-todo .step__dot { background: #fff; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--control); }
  .step__txt { margin-top: 3px; min-width: 0; }
  .step__txt b { display: block; font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .step__txt span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .step.is-current .step__txt span { color: var(--gold-700); font-weight: 600; }

  .quote-grid { display: grid; grid-template-columns: 1fr 376px; gap: 24px; align-items: start; }
  .cov-group { padding: 0 24px; }
  .cov-group h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 20px 0 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .cov-group h3 span { font-weight: 500; color: var(--ink-3); }
  .cov-row { display: grid; grid-template-columns: 44px 1fr 214px 104px; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
  .cov-row:last-child { border-bottom: 0; }
  .cov-row b { font-size: 14.5px; font-weight: 600; color: var(--ink); display: block; }
  .cov-row .desc { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; display: block; line-height: 1.45; }
  .cov-row .price { text-align: right; font-variant-numeric: tabular-nums; font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .cov-row .price small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .cov-row.is-off b { color: var(--ink-2); }
  .cov-row.is-off .price { color: var(--ink-3); font-weight: 500; }
  .toggle { width: 40px; height: 24px; border-radius: 999px; position: relative; background: var(--control); transition: background-color .2s; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(7,20,39,.25); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  .toggle.is-on { background: var(--navy-900); }
  .toggle.is-on::after { transform: translateX(16px); }
  .select { height: 40px; border: 1px solid var(--control); border-radius: var(--r-ctl); padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--ink); background: #fff; font-variant-numeric: tabular-nums; }
  .select .ic { color: var(--ink-2); width: 16px; height: 16px; }
  .select.is-focus { border-color: var(--navy-600); box-shadow: 0 0 0 3px rgba(36,80,143,.18); }
  .select.is-disabled { background: var(--surface-2); color: var(--ink-3); border-color: #C9D0DA; }
  .ctl-help { font-size: 12px; color: var(--ink-3); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--control); border-radius: var(--r-ctl); padding: 3px; height: 40px; gap: 3px; }
  .seg span { display: grid; place-items: center; font-size: 13.5px; font-weight: 500; color: var(--ink-2); border-radius: 5px; }
  .seg span.is-on { background: var(--navy-900); color: #fff; font-weight: 600; }
  .wizard-nav { display: flex; align-items: center; gap: 10px; padding: 18px 24px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-card) var(--r-card); }

  .calc { position: sticky; top: 24px; overflow: hidden; }
  .calc__head { display: flex; justify-content: space-between; align-items: flex-start; padding: 22px 24px 4px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ok); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(30,107,71,.15); }
  .calc__sec { padding: 14px 24px 4px; }
  .calc__sec h4 { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .calc__sec h4 span { font-weight: 500; color: var(--ink-3); }
  .leader { display: flex; align-items: baseline; font-size: 13.5px; color: var(--ink); padding: 4px 0; font-variant-numeric: tabular-nums; }
  .leader .dots { flex: 1; border-bottom: 1px dotted #B9C1CD; margin: 0 8px; transform: translateY(-4px); min-width: 16px; }
  .leader .v { white-space: nowrap; }
  .leader.is-strong { font-weight: 600; }
  .factor { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
  .factor:last-child { border-bottom: 0; }
  .factor b { font-size: 13.5px; font-weight: 600; display: block; }
  .factor span { font-size: 12px; color: var(--ink-3); }
  .factor .m { font-family: var(--serif); font-size: 19px; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); align-self: center; }
  .factor .m.is-disc { color: var(--ok); }
  .calc__sub { margin: 10px 24px 0; padding: 12px 0 14px; border-top: 1px solid var(--line); }
  .calc__total { background: var(--navy-900); color: var(--on-navy); padding: 20px 24px 20px; position: relative; overflow: hidden; }
  .calc__total-engrave { position: absolute; right: -120px; top: -150px; width: 260px; height: 260px; pointer-events: none; }
  .calc__total .lbl { font-size: 13px; color: var(--on-navy-2); font-weight: 500; position: relative; }
  .calc__total .fig { font-size: 42px; font-weight: 500; color: #fff; line-height: 1.05; margin-top: 4px; position: relative; }
  .calc__total .inst-line { font-size: 14px; color: var(--gold-300); margin-top: 6px; font-weight: 500; position: relative; font-variant-numeric: tabular-nums; }
  .calc__total .valid { font-size: 12.5px; color: var(--on-navy-3); margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.1); position: relative; font-variant-numeric: tabular-nums; }

  /* ---------- Mobile ---------- */
  .m-top { height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; background: var(--navy-900); color: var(--on-navy); }
  .m-top .iconbtn { color: var(--on-navy-2); }
  .m-top .brand__word { font-size: 20px; }
  .m-top .brand__mark { width: 26px; height: 26px; }
  .m-page { padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
  .m-title { font-family: var(--serif); font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .m-kpis { display: grid; grid-template-columns: 1fr 1fr; }
  .m-kpis .kpi { padding: 16px 16px; }
  .m-kpis .kpi::before { display: none; }
  .m-kpis .kpi:nth-child(odd) { border-right: 1px solid var(--line-soft); }
  .m-kpis .kpi:nth-child(-n+4) { border-bottom: 1px solid var(--line-soft); }
  .m-kpis .kpi__value { font-size: 28px; margin-top: 6px; }
  .m-kpis .kpi__meta { margin-top: 4px; }
  .m-card-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 16px 0; }
  .m-card-head .card__title { font-size: 18px; }
  .m-tabs { display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; background: #fff; border-top: 1px solid var(--line); }
  .m-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
  .m-tab.is-active { color: var(--navy-900); font-weight: 700; }
  .m-tab.is-active .ic { color: var(--navy-900); }
</style>
</head>

            <div class="prod"><span class="swatch" style="background:#B5862F"></span><div><b>Vida</b><span>153 apólices · 25%</span></div><div class="val"><span class="fig"><span class="u">R$</span>1,02<span class="u-after">mi</span></span></div></div>

        <section class="card">
          <div class="m-card-head"><div><h2 class="card__title">Atividades recentes</h2></div><a class="link" href="#">Ver tudo</a></div>
          <div class="feed" style="padding:6px 16px 4px">
            <div class="feed__row" style="grid-template-columns:36px 1fr"><span class="chip chip--navy"><svg class="ic"><use href="#i-shield"/></svg></span><div><div class="feed__text">Apólice <a href="#">AUTO-2026-000318</a> emitida</div><div class="feed__meta">Marcelo Tavares · R$ 3.412,60 · 14:32</div></div></div>
            <div class="feed__row" style="grid-template-columns:36px 1fr"><span class="chip chip--steel"><svg class="ic"><use href="#i-calc"/></svg></span><div><div class="feed__text">Cotação <a href="#">COT-2026-004811</a> aceita</div><div class="feed__meta">Juliana Prado · Residencial · 13:05</div></div></div>
            <div class="feed__row" style="grid-template-columns:36px 1fr"><span class="chip chip--warn"><svg class="ic"><use href="#i-buoy"/></svg></span><div><div class="feed__text">Sinistro <a href="#">SIN-2026-000097</a> aberto</div><div class="feed__meta">AUTO-2026-000042 · colisão parcial · 11:47</div></div></div>
            <div class="feed__row" style="grid-template-columns:36px 1fr"><span class="chip chip--gold"><svg class="ic"><use href="#i-filepen"/></svg></span><div><div class="feed__text">Endosso nº 2 em <a href="#">VIDA-2026-000077</a></div><div class="feed__meta">Inclusão de beneficiário · 10:20</div></div></div>
          </div>
        </section>
      </div>
      <nav class="m-tabs" aria-label="Navegação principal">
        <a class="m-tab is-active" href="#" aria-current="page"><svg class="ic"><use href="#i-dash"/></svg>Início</a>
        <a class="m-tab" href="#"><svg class="ic"><use href="#i-calc"/></svg>Cotações</a>
        <a class="m-tab" href="#"><svg class="ic"><use href="#i-shield"/></svg>Apólices</a>
        <a class="m-tab" href="#"><svg class="ic"><use href="#i-buoy"/></svg>Sinistros</a>
        <a class="m-tab" href="#"><svg class="ic"><use href="#i-more"/></svg>Mais</a>
      </nav>
    </section>
  </figure>
</main>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;

  /* ---------- Gravura (guilloché): curvas paramétricas exatas ---------- */
  function ring(cx, cy, R, a, n, b, m, copies, steps = 900) {
    const out = [];
    for (let j = 0; j < copies; j++) {
      const rot = (j / copies) * (TAU / n);
      let d = '';
      for (let s = 0; s <= steps; s++) {
        const t = (s / steps) * TAU;
        const r = R + a * Math.sin(n * t) + b * Math.sin(m * t + j * 0.9);
        const x = cx + r * Math.cos(t + rot);
        const y = cy + r * Math.sin(t + rot);
        d += (s ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
      }
      out.push(d + 'Z');
    }
    return out;
  }
  function paint(svg, size, layers, stroke, width, opacity) {
    svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('fill', 'none');
    g.setAttribute('stroke', stroke);
    g.setAttribute('stroke-width', width);
    g.setAttribute('opacity', opacity);
    layers.flat().forEach(d => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); g.appendChild(p); });
    svg.appendChild(g);
  }
  const engravings = {
    'rosette-xl': svg => { const c = 380; paint(svg, 760, [
      ring(c, c, 96, 22, 12, 6, 24, 10), ring(c, c, 178, 26, 24, 8, 48, 12),
      ring(c, c, 262, 18, 36, 7, 72, 12), ring(c, c, 330, 12, 48, 5, 96, 8)
    ], '#C9A86A', 0.7, 0.30); },
    'rosette-lg': svg => { const c = 260; paint(svg, 520, [
      ring(c, c, 70, 16, 12, 4, 24, 9), ring(c, c, 128, 20, 24, 6, 48, 11), ring(c, c, 196, 14, 36, 5, 72, 10)
    ], '#C9A86A', 0.6, 0.22); },
    'rosette-sm': svg => { const c = 130; paint(svg, 260, [
      ring(c, c, 44, 10, 10, 3, 20, 8), ring(c, c, 84, 12, 20, 4, 40, 10)
    ], '#C9A86A', 0.6, 0.26); },
  };
  document.querySelectorAll('[data-engrave]').forEach(svg => engravings[svg.dataset.engrave]?.(svg));

  /* ---------- Marca: selo gravado ---------- */
  document.querySelectorAll('[data-mark]').forEach(svg => {
    svg.setAttribute('viewBox', '0 0 32 32');
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('fill', 'none'); g.setAttribute('stroke', 'url(#foil)');
    const outer = document.createElementNS(NS, 'circle');
    outer.setAttribute('cx', 16); outer.setAttribute('cy', 16); outer.setAttribute('r', 15); outer.setAttribute('stroke-width', 1.4);
    g.appendChild(outer);
    ring(16, 16, 9.2, 2.6, 8, 0, 1, 3, 400).forEach(d => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('stroke-width', 0.85); g.appendChild(p); });
    const inner = document.createElementNS(NS, 'circle');
    inner.setAttribute('cx', 16); inner.setAttribute('cy', 16); inner.setAttribute('r', 3); inner.setAttribute('stroke-width', 1.2);
    g.appendChild(inner);
    svg.appendChild(g);
  });

  /* ---------- Navegação lateral ---------- */
  const navItems = [
    ['dash', 'Dashboard', 'i-dash', ''],
    ['cotacoes', 'Cotações', 'i-calc', '57'],
    ['apolices', 'Apólices', 'i-shield', '1.284'],
    ['sinistros', 'Sinistros', 'i-buoy', '23'],
    ['admin', 'Admin', 'i-sliders', 'lock'],
  ];
  document.querySelectorAll('[data-side]').forEach(side => {
    const active = side.dataset.side;
    const items = navItems.map(([id, label, icon, count]) => {
      const cls = ['nav__item', id === active ? 'is-active' : '', count === 'lock' ? 'is-locked' : ''].join(' ');
      const tail = count === 'lock'
        ? '<svg class="ic lock" aria-label="Restrito ao perfil Admin"><use href="#i-lock"/></svg>'
        : count ? `<span class="nav__count">${count}</span>` : '';
      return `<a class="${cls}" href="#"${id === active ? ' aria-current="page"' : ''}><svg class="ic"><use href="#${icon}"/></svg>${label}${tail}</a>`;
    }).join('');
    side.innerHTML = `
      <div class="brand"><svg class="brand__mark" data-mark-late aria-hidden="true"></svg><span class="brand__word">Apólice</span></div>
      <div class="side__org"><div><b>Ribeiro &amp; Associados</b><span>Corretora de seguros</span></div><svg class="ic ic-sm" style="color:var(--on-navy-3)"><use href="#i-chevupdown"/></svg></div>
      <nav class="nav" aria-label="Principal">${items}<div class="nav__sep"></div>
        <a class="nav__item" href="#"><svg class="ic"><use href="#i-info"/></svg>Sobre o projeto</a></nav>
      <div class="side__user"><span class="avatar avatar--navy avatar--ring">AR</span><div><b>Ana Ribeiro</b><span>Corretora</span></div>
        <a class="switch" href="#" aria-label="Trocar persona"><svg class="ic ic-sm"><use href="#i-swap"/></svg></a></div>`;
  });
  document.querySelectorAll('[data-mark-late]').forEach(svg => {
    svg.setAttribute('viewBox', '0 0 32 32');
    svg.innerHTML = document.querySelector('[data-mark]').innerHTML;
  });

  /* ---------- Cronograma de parcelas ---------- */
  const months = ['03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
  const paidOn = ['15/03', '14/04', '15/05', '13/06', '15/07', '14/08', '15/09', '13/10'];
  const sched = document.querySelector('[data-sched]');
  if (sched) sched.innerHTML = months.map((mm, i) => {
    const n = i + 1, val = n === 10 ? '486,22' : '486,24';
    const state = n <= 8 ? 'is-paid' : n === 9 ? 'is-next' : 'is-open';
    const status = n <= 8 ? `Paga em ${paidOn[i]}` : n === 9 ? 'Próxima' : 'A vencer';
    const icon = n <= 8 ? '<svg class="ic ic-xs"><use href="#i-check"/></svg>' : '';
    return `<div class="inst ${state}"><div class="inst__n">${n}/10${icon}</div><div class="inst__d">15/${mm}/2026</div><div class="inst__v">R$ ${val}</div><div class="inst__s">${status}</div></div>`;
  }).join('');

  /* ---------- Gráfico de prêmio emitido ---------- */
  const data = [284, 298, 341, 276, 305, 322, 358, 347, 369, 391, 377, 412];
  const labels = ['out', 'nov', 'dez', 'jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set'];
  function barPath(x, base, top, w, r) {
    return `M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${base}Z`;
  }
  function chart(svg, o) {
    const { W, H, padL, padR, padT, padB, barW, font, ticks, yMax, tip, years } = o;
    const plotW = W - padL - padR, plotH = H - padT - padB, base = padT + plotH, slot = plotW / data.length;
    let s = '';
    ticks.forEach(t => {
      const y = base - (t / yMax) * plotH;
      s += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="${t === 0 ? '#C9D0DA' : '#E9EDF2'}" stroke-width="1"/>`;
      s += `<text x="${padL - 10}" y="${y + 4}" text-anchor="end" font-size="${font}" fill="#5D697D">${t}</text>`;
    });
    const avg = data.reduce((a, b) => a + b, 0) / data.length;
    const ay = base - (avg / yMax) * plotH;
    s += `<line x1="${padL}" x2="${W - padR}" y1="${ay}" y2="${ay}" stroke="#7A5C2C" stroke-width="1" stroke-dasharray="3 4" opacity=".75"/>`;
    s += `<text x="${padL + 6}" y="${ay - 7}" font-size="${font}" fill="#7A5C2C" font-weight="600">Média ${Math.round(avg)}</text>`;
    data.forEach((v, i) => {
      const x = padL + i * slot + (slot - barW) / 2, top = base - (v / yMax) * plotH;
      const last = i === data.length - 1;
      s += `<path d="${barPath(x, base, top, barW, 4)}" fill="${last ? '#B5862F' : '#1D3B6B'}"><title>${labels[i]}: R$ ${v} mil</title></path>`;
      s += `<text x="${x + barW / 2}" y="${base + font + 8}" text-anchor="middle" font-size="${font}" fill="${last ? '#0E1A2C' : '#5D697D'}" font-weight="${last ? 700 : 400}">${labels[i]}</text>`;
    });
    if (years) {
      s += `<text x="${padL + slot / 2}" y="${base + font * 2 + 14}" text-anchor="middle" font-size="${font - 1}" fill="#5D697D">2025</text>`;
      s += `<text x="${padL + 3 * slot + slot / 2}" y="${base + font * 2 + 14}" text-anchor="middle" font-size="${font - 1}" fill="#5D697D">2026</text>`;
    }
    if (tip) {
      const i = data.length - 1, x = padL + i * slot + slot / 2, top = base - (data[i] / yMax) * plotH;
      const tw = 168, th = 58, tx = x - tw + 18, ty = top - th - 12;
      s += `<g filter="url(#tipShadow)"><rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="8" fill="#0B1F3A"/></g>`;
      s += `<path d="M${x - 6},${ty + th} L${x},${ty + th + 6} L${x + 6},${ty + th} Z" fill="#0B1F3A"/>`;
      s += `<text x="${tx + 14}" y="${ty + 22}" font-size="12" fill="#B8C3D6">set/2026 · 96 apólices</text>`;
      s += `<text x="${tx + 14}" y="${ty + 44}" font-size="17" fill="#FFFFFF" font-weight="600" font-family="Source Serif 4, Georgia, serif">R$ 412,0 mil</text>`;
    }
    svg.innerHTML = `<defs><filter id="tipShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#071427" flood-opacity=".25"/></filter></defs>` + s;
  }
  document.querySelectorAll('[data-chart="desk"]').forEach(svg => chart(svg, { W: 685, H: 300, padL: 40, padR: 4, padT: 70, padB: 46, barW: 26, font: 12, ticks: [0, 150, 300, 450], yMax: 450, tip: true, years: true }));
  document.querySelectorAll('[data-chart="mobile"]').forEach(svg => chart(svg, { W: 338, H: 196, padL: 34, padR: 2, padT: 18, padB: 40, barW: 14, font: 11, ticks: [0, 150, 300, 450], yMax: 450, tip: false, years: true }));
})();
</script>
