name: CI

# Actions fixadas por SHA com a versão no comentário: o Dependabot atualiza os dois juntos e uma
# tag movida em repositório de terceiros não muda o que roda aqui.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo PR/branch torna a execução anterior inútil.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explícito para ganhar "-eo pipefail": sem isso, falha no meio de um pipe passa batido.
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Mesma versão no deploy.yml: o lockfile do Terraform e o state não podem regredir.
  TERRAFORM_VERSION: "1.17.0"

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Cache manual: o repositório não usa packages.lock.json, que o cache embutido do
      # setup-dotnet exige como chave.
      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Apolice.slnx

      # O build executa a API (GetDocument.Insider) para gerar o v1.json sem ASPNETCORE_ENVIRONMENT,
      # ou seja, em Production, igual ao build na máquina de quem desenvolve. Não forçar
      # Development aqui: o contrato do CI sairia de outro ambiente que o local e o drift viraria
      # falso positivo. Por isso o Program.cs precisa pular SSM e as exigências de produção
      # (Jwt:SigningKey, Seed:SenhaUsuarios) quando o entry assembly é o GetDocument.Insider.
      - name: Build
        run: dotnet build Apolice.slnx -c Release --no-restore

      # O build regenera docs/openapi/v1.json; se mudou, o contrato commitado está velho e o
      # cliente tipado do frontend seria gerado a partir de uma mentira. "git status" e não
      # "git diff": o diff ignora arquivo não rastreado, e um v1.json nunca commitado (ou apagado
      # do repositório) passaria em silêncio.
      - name: Contrato OpenAPI sem drift
        run: |
          if [ -n "$(git status --porcelain -- docs/openapi/v1.json)" ]; then
            git status --short -- docs/openapi/v1.json
            git diff -- docs/openapi/v1.json
            echo "::error file=docs/openapi/v1.json::Contrato OpenAPI desatualizado ou não commitado. Rode 'dotnet build' e commite docs/openapi/v1.json."
            exit 1
          fi

      # Os testes de integração sobem PostgreSQL/RabbitMQ via Testcontainers no Docker do runner.
      - name: Testes
        run: >-
          dotnet test Apolice.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Relatório de cobertura
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;MarkdownSummaryGithub;Cobertura
          assemblyfilters: +Apolice.Domain;+Apolice.Application;+Apolice.Infrastructure;+Apolice.Api;+Apolice.Worker
          filefilters: -**/Migrations/**
          title: Apólice — cobertura

      - name: Resumo da cobertura
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage-report
          retention-days: 14

      # O alvo da SPEC (§10) vale para Domain + Application, e o relatório acima mistura todas as
      # camadas num número só. Este resumo isola as duas para a cobrança abaixo; ela vem depois
      # do upload para o relatório completo sair mesmo quando a cobertura cai.
      - name: Cobertura de Domain + Application
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-core
          reporttypes: JsonSummary
          assemblyfilters: +Apolice.Domain;+Apolice.Application

      - name: Cobertura mínima (Domain + Application)
        env:
          COBERTURA_MINIMA: "80"
        run: |
          linhas="$(jq -r '.summary.linecoverage' coverage-core/Summary.json)"
          echo "Cobertura de linhas em Domain + Application: ${linhas}% (mínimo: acima de ${COBERTURA_MINIMA}%)"
          if ! jq -e --argjson minimo "$COBERTURA_MINIMA" '.summary.linecoverage > $minimo' \
            coverage-core/Summary.json > /dev/null; then
            echo "::error::Cobertura de Domain + Application em ${linhas}%; a SPEC pede mais de ${COBERTURA_MINIMA}%."
            exit 1
          fi

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versão do pnpm vem do campo "packageManager" do frontend/package.json (fonte única).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Fecha o elo backend → contrato → tipos: o backend garante que v1.json bate com o código;
      # aqui garantimos que os tipos commitados batem com o v1.json ("git status" pelo mesmo
      # motivo do contrato: pega também o arquivo não rastreado).
      - name: Tipos da API sem drift
        run: |
          pnpm run gen:api
          if [ -n "$(git status --porcelain -- src/api/schema.d.ts)" ]; then
            git status --short -- src/api/schema.d.ts
            git diff -- src/api/schema.d.ts
            echo "::error file=frontend/src/api/schema.d.ts::Tipos da API desatualizados ou não commitados. Rode 'pnpm gen:api' e commite src/api/schema.d.ts."
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Testes
        run: pnpm run test

      - name: Build
        run: pnpm run build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --wait só retorna com a api saudável (/health/ready) e migrate/seed concluídos com sucesso.
      - name: Subir a stack (docker compose)
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador do Playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # O preview serve o build de produção e faz proxy de /api para a api do compose (8080),
      # então o browser vê uma origem só, como na Vercel.
      - name: Build e preview do frontend
        working-directory: frontend
        run: |
          pnpm run build
          nohup pnpm exec vite preview --port 4173 --strictPort > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$BASE_URL"; then exit 0; fi
            sleep 1
          done
          echo "::error::vite preview não respondeu em $BASE_URL"
          cat "$RUNNER_TEMP/vite-preview.log"
          exit 1

      - name: Testes E2E
        working-directory: frontend
        run: pnpm run test:e2e

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Logs do docker compose
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Formatação
        run: terraform fmt -check -recursive -diff infra

      # -backend=false: valida a configuração sem credenciais nem acesso ao state.
      - name: Validate
        run: |
          for dir in infra/bootstrap infra/terraform; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
