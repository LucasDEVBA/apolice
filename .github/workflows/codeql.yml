name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Semanal: novas queries e CVEs aparecem mesmo sem commit novo.
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Necessário em repositório privado para ler os metadados da execução.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build manual: o autobuild escolheria sozinho o que compilar e poderia pular projetos.
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          # Os próprios workflows também são código privilegiado (o deploy assume a role de prod).
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Sem compilação compartilhada o CodeQL enxerga todas as invocações do compilador; a
      # geração do OpenAPI só executaria a aplicação sem acrescentar código à análise.
      - name: Build
        if: matrix.language == 'csharp'
        run: >-
          dotnet build Apolice.slnx -c Release
          -p:UseSharedCompilation=false
          -p:OpenApiGenerateDocuments=false

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
